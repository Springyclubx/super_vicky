include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Machine-generated localization code (Flutter Intl / intl_utils output).
    # Not hand-maintained, so it is excluded from lint rules such as
    # public_member_api_docs rather than being edited by hand.
    - lib/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - public_member_api_docs
    - type_annotate_public_apis
    - prefer_const_constructors
    - prefer_final_fields
    - avoid_print
    - prefer_single_quotes
    - prefer_is_empty
    - prefer_is_not_empty
    - avoid_dynamic_calls
    - unnecessary_new
    - void_checks
formatter:
  trailing_commas: preserve